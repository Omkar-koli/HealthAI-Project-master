# LOCAL DEVELOPMENT STACK ONLY.
# This runs its own throwaway PostgreSQL container and stores uploads on a local volume.
# Its data is NOT the real data. Real data lives in Cloud SQL + Cloud Storage and is served by
# docker-compose.cloud.yml on the VM. The UI banner and GET /health show which stack you are on.

services:
  db:
    image: postgres:15-alpine
    container_name: healthai-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Same migration files used in the cloud; Postgres runs them on first start of an empty volume.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - healthai-net
    # No ports published to the host on purpose: only 'backend' needs to reach
    # this database, and it does so over the internal network by hostname 'db'.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: healthai-backend:dev
    container_name: healthai-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_BACKEND: local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - healthai-net

  frontend:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: healthai-frontend:dev
    container_name: healthai-frontend
    restart: always
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"
    networks:
      - healthai-net

volumes:
  pgdata:
  uploads_data:

networks:
  healthai-net:
    driver: bridge
