# Save this file as: docker-compose.yml  (at the project ROOT, next to backend/ and dashboard/)

services:
  db:
    image: postgres:15-alpine
    container_name: healthai-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - healthai-net
    # No ports published to the host on purpose: only 'backend' needs to reach
    # this database, and it does so over the internal network by hostname 'db'.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: healthai-backend:v1
    container_name: healthai-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - healthai-net

  frontend:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: healthai-frontend:v1
    container_name: healthai-frontend
    restart: always
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"
    networks:
      - healthai-net

volumes:
  pgdata:
  uploads_data:

networks:
  healthai-net:
    driver: bridge
