# The identity the pods run as. Workload Identity links it to the Google service account
# healthai-gke-app, which holds the Secret Manager and Cloud Storage roles. No key files anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: healthai-app
  annotations:
    iam.gke.io/gcp-service-account: healthai-gke-app@healthai-508921.iam.gserviceaccount.com
