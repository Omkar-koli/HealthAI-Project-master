apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
  annotations:
    cloud.google.com/neg: '{"ingress": true}'                                  # container-native load balancing
    cloud.google.com/backend-config: '{"default": "frontend-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 8501
      targetPort: http
